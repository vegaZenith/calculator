<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Calculator</title>
        <meta charset="utf-8">
        <link href="styles/style.css" rel="stylesheet">
        <script src="src/app.js" defer></script>
    </head>
    <body>
        <div class="display"></div>
        <div class="container">
            
            <div class="section">
                <div class="row">
                    <button class="small-button operator">/</button>
                    <button class="small-button operator">*</button>
                    <button class="small-button operator">-</button>
                </div>
                <div class="row">
                    <button class="small-button number-button">7</button>
                    <button class="small-button number-button">8</button>
                    <button class="small-button number-button">9</button>
                </div>
                <div class="row">
                    <button class="small-button number-button">4</button>
                    <button class="small-button number-button">5</button>
                    <button class="small-button number-button">6</button>
                </div>
                <div class="row">
                    <button class="small-button number-button">1</button>
                    <button class="small-button number-button">2</button>
                    <button class="small-button number-button">3</button>
                </div>
                <div class="row">
                    <button class="small-button number-button">0</button>
                    <button class="big-button clear">Clear</button>                   
                </div>
            </div>
            <div class="section">
                <button class="big-button-column operator">+</button>
                <button class="big-button-column equals">=</button>
                <button class="small-button decimal">.</button>
            </div>
        </div>
    </body>
</html>
