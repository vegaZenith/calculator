<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Calculator</title>
        <meta charset="utf-8">
        <link href="styles/style.css" rel="stylesheet">
        <script src="src/app.js" defer></script>
    </head>
    <body>
        <div class="display">0</div>
        <div class="container">
            <div class="section">
                <div class="row">
                    <button class="small-button">/</button>
                    <button class="small-button">*</button>
                    <button class="small-button">-</button>
                </div>
                <div class="row">
                    <button class="small-button">7</button>
                    <button class="small-button">8</button>
                    <button class="small-button">9</button>
                </div>
                <div class="row">
                    <button class="small-button">4</button>
                    <button class="small-button">5</button>
                    <button class="small-button">6</button>
                </div>
                <div class="row">
                    <button class="small-button">1</button>
                    <button class="small-button">2</button>
                    <button class="small-button">3</button>
                </div>
                <div class="row">
                    <button class="small-button">0</button>
                    <button class="big-button">Clear</button>
                </div>
            </div>
            <div class="section">
                <button class="big-button-column">+</button>
                <button class="big-button-column">=</button>
            </div>
        </div>
    </body>
</html>
